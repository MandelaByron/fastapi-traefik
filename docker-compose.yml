

services:

  traefik:
    image: "traefik:v3"
    container_name: "traefik"
    command:
      # Enable Docker provider to auto-discover containers
      - "--providers.docker=true"
      # Don't expose containers by default (only via labels)
      - "--providers.docker.exposedbydefault=false"
      # Enable Traefik dashboard
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # Configure entrypoints
      - "--entrypoints.app.address=:80"

      - "--experimental.plugins.souin.modulename=github.com/darkweak/souin"
      - "--experimental.plugins.souin.version=v1.7.9"
    networks:
      - traefik-network

    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    image: ${IMAGE_REPO:-ghcr.io/mandelabyron/fastapi-demo}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SERVICE_NAME: "app"
    command: fastapi run --host 0.0.0.0 --port 8000 src/fastapi_example
    labels:
      # Enable this container for Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=PathPrefix(`/api`)"
 
      - "traefik.http.routers.app.entrypoints=app"
      # Service configuration (port 8000 is internal, not exposed)
      - "traefik.http.services.app.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.app-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.app.middlewares=app-stripprefix"

      # During a rolling swap two containers answer for this Host rule and
      # Traefik load-balances across both. These settings keep the overlap
      # invisible:
      #   healthcheck — drop a server as soon as it stops passing, instead of
      #                 waiting for the container die event
      #   retry       — replay a request on the other server if one is caught
      #                 mid-shutdown
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.app.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.middlewares.app-retry.retry.attempts=3"
      - "traefik.http.middlewares.app-retry.retry.initialinterval=100ms"

      - "traefik.http.middlewares.app-stripprefix.stripprefix.prefixes=/app"
      - "traefik.http.middlewares.app-souin.plugin.souin.api.souin"
      - "traefik.http.middlewares.app-souin.plugin.souin.default_cache.ttl=30s"
      - "traefik.http.middlewares.app-souin.plugin.souin.log_level=debug"
      - "traefik.http.routers.app.middlewares=app-stripprefix,app-souin"

    depends_on:
      - traefik
    networks:
      - traefik-network




networks:
  traefik-network:
    driver: bridge