

services:

  traefik:
    image: "traefik:v3"
    container_name: "traefik"
    command:
      # Enable Docker provider to auto-discover containers
      - "--providers.docker=true"
      # Don't expose containers by default (only via labels)
      - "--providers.docker.exposedbydefault=false"
      # Enable Traefik dashboard
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # Configure entrypoints
      - "--entrypoints.app.address=:80"
    networks:
      - traefik-network

    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    environment:
      SERVICE_NAME: "app"
    command: fastapi run --host 0.0.0.0 --port 8000 src/fastapi_example
    labels:
      # Enable this container for Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=PathPrefix(`/api`)"
 
      - "traefik.http.routers.app.entrypoints=app"
      # Service configuration (port 8000 is internal, not exposed)
      - "traefik.http.services.app.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.app-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.app.middlewares=app-stripprefix"

    depends_on:
      - traefik
    volumes:
      - ./app/app:/app/app
    networks:
      - traefik-network




networks:
  traefik-network:
    driver: bridge